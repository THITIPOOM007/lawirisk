project_id = "evidenceverse"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://evidenceverse-staging.evidenceverse-th.workers.dev"
additional_redirect_urls = [
  "https://evidenceverse-staging.evidenceverse-th.workers.dev/login",
  "http://127.0.0.1:3000/login",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
# Keep the email provider enabled for existing/admin-provisioned users. Public
# self-registration remains disabled by auth.enable_signup above.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[auth.mfa]
max_enrolled_factors = 4

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
